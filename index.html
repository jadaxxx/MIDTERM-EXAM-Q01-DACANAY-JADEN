<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Expense Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #222; margin: 0; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 32px 16px 56px; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 1.4rem; margin: 0; color: #2f5d8a; }
  .total { background: #fff; border: 1px solid #e3e8ee; border-radius: 8px; padding: 10px 18px; text-align: right; }
  .total small { display: block; color: #777; font-size: 0.8rem; }
  #total { font-size: 1.5rem; font-weight: 700; color: #2e7d4f; }

  .card { background: #fff; border: 1px solid #e3e8ee; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  h3 { font-size: 1rem; margin: 0 0 14px; color: #2f5d8a; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #d5dce4; border-radius: 6px; font: inherit; background: #fff; }
  input:focus { outline: none; border-color: #2f5d8a; }

  button { padding: 8px 16px; border: 1px solid #2f5d8a; border-radius: 6px; background: #2f5d8a; color: #fff; font: inherit; cursor: pointer; }
  button:hover { background: #254b70; }
  td button { padding: 4px 10px; background: #fff; border-color: #c0504d; color: #c0504d; font-size: 0.85rem; }
  td button:hover { background: #fbeeee; }

  .find { display: flex; gap: 8px; align-items: end; }
  .find div { flex: 1; }
  #find-result { margin: 12px 0 0; font-size: 0.9rem; color: #444; }
  #add-msg { color: #c0504d; margin: 10px 0 0; font-size: 0.9rem; min-height: 1.2em; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #edf0f4; font-size: 0.92rem; }
  th { font-weight: 600; color: #2f5d8a; font-size: 0.8rem; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }

  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Personal Expense Tracker</h1>
    <div class="total"><small>Total spent</small><span id="total">0.00</span></div>
  </header>

  <div class="card">
    <h3>Add expense</h3>
    <form id="add-form">
      <div class="grid">
        <div class="full"><label for="description">Description</label><input id="description" required></div>
        <div><label for="category">Category</label><input id="category" required></div>
        <div><label for="amount">Amount</label><input id="amount" type="number" step="0.01" required></div>
        <div class="full"><label for="date">Date</label><input id="date" type="date" required></div>
      </div>
      <p id="add-msg"></p>
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="card">
    <h3>Find by ID</h3>
    <form id="find-form" class="find">
      <div><label for="find-id">ID</label><input id="find-id" type="number" required></div>
      <button type="submit">Search</button>
    </form>
    <p id="find-result"></p>
  </div>

  <div class="card">
    <h3>All expenses</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>Description</th><th>Category</th><th>Amount</th><th>Date</th><th></th></tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API = '/api/expenses';

async function load() {
  const expenses = await (await fetch(API)).json();
  const list = document.getElementById('list');
  list.innerHTML = '';
  let total = 0;

  expenses.forEach(e => {
    total += e.amount;
    const tr = document.createElement('tr');
    [e.id, e.description, e.category, e.amount.toFixed(2), e.date].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.textContent = 'Delete';
    btn.onclick = () => remove(e.id);
    td.appendChild(btn);
    tr.appendChild(td);
    list.appendChild(tr);
  });

  document.getElementById('total').textContent = total.toFixed(2);
}

document.getElementById('add-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: document.getElementById('description').value,
      category: document.getElementById('category').value,
      amount: parseFloat(document.getElementById('amount').value),
      date: document.getElementById('date').value
    })
  });
  const data = await res.json();
  document.getElementById('add-msg').textContent = res.ok ? '' : data.error;
  if (res.ok) { ev.target.reset(); load(); }
});

async function remove(id) {
  if (!confirm('Delete expense ' + id + '?')) return;
  await fetch(API + '/' + id, { method: 'DELETE' });
  document.getElementById('find-result').textContent = '';
  load();
}

document.getElementById('find-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = document.getElementById('find-id').value;
  const res = await fetch(API + '/' + id);
  const data = await res.json();
  document.getElementById('find-result').textContent = res.ok
    ? `#${data.id} | ${data.description} | ${data.category} | ${data.amount.toFixed(2)} | ${data.date}`
    : data.error;
});

load();
</script>

</body>
</html>
